<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RUANG-TAMU</title>
    <link rel="stylesheet" href="style.css" />
    
  </head>
  <body>
    <div class="panel-body">
      <h1>RUANG TAMU 3D - KELOMPOK (K)</h1>

      <!-- tombol sudut pandang (POV) -->
      <button id="btn-toggle-panel" type="button">Hiden</button>
      <div class="control-group">
        <div class="control-label">
          <span>Sudut pandang camera</span>
        </div>
        <div class="btn-grid">
          <button id="btn-front" class="btn-action" type="button">
            tampak depan
          </button>
          <button id="btn-top" class="btn-action" type="button">
            tampak atas
          </button>
        </div>
      </div>
    </div>

    <!-- tombol untuk mengubah mode -->
    <div class="control-group">
      <div class="control-label">
        <span>suasana cahaya</span>
      </div>
      <button id="btn-theme" type="button">mode siang</button>
    </div>

    <div class="control-group">
      <div class="control-label">
        <label for="light-intensity">intensitas</label>
        <span id="identity-val" class="badge-value">1.5</span>
      </div>
      <input type="range" id="light-intensity min="0" max="4" step="0.1" value="1.5">
    </div>

    <div class="control-group">
      <div class="control-label">
        <label for="light-intensity">warna utama</label>
      </div>
      <div class="color-row">
        <input type="color" id="light-color" value="ffffff" />
          <span id="color-hex-label" class="color-hex">#FFFFFF</span>
        </div>
    </div>
    <hr />

    <!-- transformasi benda benda  -->
     <div class="control-group">
      <div class=""></div>
     </div>

    <script src="script.js"></script>
  </body>
</html>
